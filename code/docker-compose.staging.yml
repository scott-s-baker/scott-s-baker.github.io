# Prism DIA — STAGING override (192.168.1.126)
#
# Usage (on the staging host, /opt/prism-staging, branch develop):
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# Service keys match the base docker-compose.yml (api / postgres / weaviate /
# prefect) — the prism-* names in `docker ps` are container_name values, not
# service keys, and an override keyed on them would silently define new
# broken services instead of overriding.
#
# All containers are renamed prism-staging-* so `docker ps` output can never
# be mistaken for prod. All three data volumes are staging-named and
# external — create them once on the staging host before first up:
#   docker volume create prism_staging_pgdata
#   docker volume create prism_staging_weaviate_data
#   docker volume create prism_staging_prefect_data
# (weaviate/prefect overrides are required: without them the base file's
# external prod volume names would be demanded on the staging host.)

services:
  api:
    build:
      context: ./app
    container_name: prism-staging-api
    restart: unless-stopped
    env_file: .env.staging
    volumes:
      - /opt/prism-staging/app:/app
      - /opt/prism-staging/config:/app/config
    networks:
      - prism_staging_default

  postgres:
    container_name: prism-staging-postgres
    networks:
      - prism_staging_default
    volumes:
      - prism_staging_pgdata:/var/lib/postgresql/data

  weaviate:
    container_name: prism-staging-weaviate
    networks:
      - prism_staging_default
    volumes:
      - prism_staging_weaviate_data:/var/lib/weaviate

  prefect:
    container_name: prism-staging-prefect
    networks:
      - prism_staging_default
    volumes:
      - prism_staging_prefect_data:/root/.prefect

networks:
  prism_staging_default:
    name: prism_staging_default

volumes:
  prism_staging_pgdata:
    name: prism_staging_pgdata
    external: true
  prism_staging_weaviate_data:
    name: prism_staging_weaviate_data
    external: true
  prism_staging_prefect_data:
    name: prism_staging_prefect_data
    external: true
